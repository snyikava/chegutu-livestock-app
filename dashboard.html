<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chegutu Livestock Census — Dashboard</title>
<style>
  :root { --green:#1F3D2B; --gold:#B8860B; --bg:#fbfaf7; --line:#d8d5cb; --muted:#6b6b63; --ink:#1c1c1a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
  header { background:var(--green); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header .brand { font-weight:700; letter-spacing:0.06em; font-size:13px; text-transform:uppercase; }
  header .brand span { color:var(--gold); }
  header .meta { font-size:11.5px; opacity:0.9; }
  nav.tabs { background:#16301f; display:flex; }
  nav.tabs button {
    background:none; border:none; color:#cfe0d4; padding:10px 18px; font-size:12px; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase; border-bottom:2.5px solid transparent; cursor:pointer;
  }
  nav.tabs button.active { color:#fff; border-bottom-color:var(--gold); }
  main { max-width: 1080px; margin: 0 auto; padding: 16px 20px 40px; }
  .stats { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 16px; min-width:120px; }
  .stat .n { font-size:22px; font-weight:700; color:var(--green); }
  .stat .l { font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12.5px; }
  th { text-align:left; background:var(--green); color:#fff; padding:8px 10px; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:nth-child(even) td { background:#f6f4ee; }
  .empty { padding: 30px; text-align:center; color: var(--muted); font-size:13px; }
  .pill { display:inline-block; background:#e7efe9; color:var(--green); border:1px solid var(--green); border-radius:10px; padding:1px 7px; font-size:10.5px; margin:1px 2px 1px 0; }
  .lag { font-size:10.5px; color: var(--muted); }
  .lag.instant { color: var(--green); }

  .ward-card { background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden; }
  .ward-card .ward-head {
    background:#f1efe6; padding:9px 14px; display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--line); flex-wrap:wrap; gap:6px;
  }
  .ward-card .ward-head .title { font-size:13.5px; font-weight:700; color:var(--green); }
  .ward-card .ward-head .sub { font-size:11px; color:var(--muted); }
  table.species-table { border:none; border-radius:0; font-size:11.5px; }
  table.species-table th { background:#fff; color:var(--green); border-bottom:2px solid var(--green); font-size:10px; }
  table.species-table td { font-size:11.5px; }
  .breakdown { color:var(--muted); font-size:10.5px; }
  .breed-pill { display:inline-block; background:#fbf3e2; color:#8a6508; border:1px solid var(--gold); border-radius:10px; padding:1px 7px; font-size:10px; margin:1px 3px 1px 0; }

  .pill.source-field { background:#e7efe9; color:var(--green); border-color:var(--green); }
  .pill.source-self { background:#eef1fb; color:#2b3f8f; border-color:#2b3f8f; }
  .pill.verified-yes { background:#e7efe9; color:var(--green); border-color:var(--green); }
  .pill.verified-no { background:#fbeee2; color:#a05a1f; border-color:#a05a1f; }
  .stat.pending .n { color:#a05a1f; }
  button.verify-btn {
    margin-top:4px; border:1px solid var(--green); background:#fff; color:var(--green);
    border-radius:6px; padding:3px 8px; font-size:10.5px; font-weight:600; cursor:pointer;
  }
  button.verify-btn:active { background:#e7efe9; }
  button.verify-btn:disabled { opacity:0.6; cursor:default; }
</style>
</head>
<body>
<header>
  <div class="brand">Value10<span>x</span> · Chegutu Livestock Census — Live Dashboard</div>
  <div class="meta" id="meta">Loading…</div>
</header>
<nav class="tabs">
  <button id="tab-feed-btn" class="active">Live Feed</button>
  <button id="tab-ward-btn">Ward Report</button>
</nav>
<main>
  <div class="stats">
    <div class="stat"><div class="n" id="stat-total">–</div><div class="l">Households received</div></div>
    <div class="stat"><div class="n" id="stat-wards">–</div><div class="l">Wards covered</div></div>
    <div class="stat"><div class="n" id="stat-lag">–</div><div class="l">Median field→server lag</div></div>
    <div class="stat pending"><div class="n" id="stat-pending">–</div><div class="l">Self-reports pending verification</div></div>
  </div>
  <div id="view-feed"><div id="table-wrap"></div></div>
  <div id="view-ward" style="display:none;"><div id="ward-wrap"></div></div>
</main>
<script src="/schema.js"></script>
<script>
const SCHEMA = window.LIVESTOCK_SCHEMA;
let latestRows = [];

async function load() {
  const res = await fetch('/api/submissions', { cache: 'no-store' });
  const rows = await res.json();
  latestRows = rows;
  document.getElementById('meta').textContent = 'Auto-refreshing every 4s — ' + new Date().toLocaleTimeString();
  document.getElementById('stat-total').textContent = rows.length;
  document.getElementById('stat-wards').textContent = new Set(rows.map(r => r.ward)).size;
  const lags = rows.map(r => r.sync_latency_ms).filter(v => typeof v === 'number' && v >= 0).sort((a,b)=>a-b);
  document.getElementById('stat-lag').textContent = lags.length ? fmtLag(lags[Math.floor(lags.length/2)]) : '–';
  document.getElementById('stat-pending').textContent = rows.filter(r => r.verified === false).length;

  renderFeed(rows);
  renderWardReport(rows);
}

function renderFeed(rows) {
  const wrap = document.getElementById('table-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">No households synced yet. Submit the form on a device, or reconnect a queued device, and it will appear here automatically.</div>';
    return;
  }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Received</th><th>Ward</th><th>Village</th><th>Household</th><th>Enumerator</th>
      <th>Visit date</th><th>Species kept</th><th>Source</th><th>Verified</th><th>Field → server lag</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td>${new Date(r.received_at).toLocaleString()}</td>
        <td>${escapeHtml(r.ward)}</td>
        <td>${escapeHtml(r.village)}</td>
        <td>${escapeHtml(r.household_head_name)}<br><span class="lag">${escapeHtml(r.household_id)}</span></td>
        <td>${escapeHtml(r.enumerator_name)}</td>
        <td>${escapeHtml(r.collection_date)}</td>
        <td>${(r.species||[]).map(s => `<span class="pill">${escapeHtml(s)}</span>`).join('') || '<span class="lag">none recorded</span>'}</td>
        <td>${fmtSourceCell(r.source)}</td>
        <td>${fmtVerifiedCell(r.verified, r.localId)}</td>
        <td>${fmtLagCell(r.sync_latency_ms)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;

  // Event delegation so newly-rendered "Mark verified" buttons work without
  // re-binding a listener on every refresh (the table is fully replaced every 4s).
  wrap.querySelectorAll('button.verify-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        const res = await fetch(`/api/submissions/${encodeURIComponent(btn.dataset.id)}/verify`, { method: 'PATCH' });
        if (!res.ok) throw new Error('request failed');
        await load();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Mark verified';
        alert('Could not mark this as verified — check your connection and try again.');
      }
    });
  });
}

// ---- Ward Report: aggregate synced submissions by ward, species, and breed/type ----
function aggregateByWard(rows) {
  const wards = {};
  rows.forEach(r => {
    const w = r.ward || '(no ward recorded)';
    if (!wards[w]) wards[w] = { ward: w, households: new Set(), species: {}, field: 0, self: 0, pending: 0 };
    wards[w].households.add(r.household_id || r.localId);
    if ((r.source || 'field') === 'field') wards[w].field++; else wards[w].self++;
    if (r.verified === false) wards[w].pending++;
    const data = r.data || {};
    (SCHEMA ? SCHEMA.groups : []).forEach(g => {
      if (data[g.hasField] !== 'yes') return;
      if (!wards[w].species[g.key]) {
        wards[w].species[g.key] = { label: g.label, total: 0, counts: {}, selects: {} };
      }
      const bucket = wards[w].species[g.key];
      g.fields.forEach(f => {
        if (f.type === 'integer') {
          const v = parseInt(data[f.name], 10);
          if (!isNaN(v)) { bucket.total += v; bucket.counts[f.label] = (bucket.counts[f.label] || 0) + v; }
        } else if (f.type === 'decimal') {
          const v = parseFloat(data[f.name]);
          if (!isNaN(v)) bucket.counts[f.label] = (bucket.counts[f.label] || 0) + v;
        } else if (f.type === 'select_one') {
          const v = data[f.name];
          if (v) {
            const list = (SCHEMA.choices[f.choices] || []);
            const found = list.find(c => c[0] === v);
            const label = found ? found[1] : v;
            if (!bucket.selects[f.label]) bucket.selects[f.label] = {};
            bucket.selects[f.label][label] = (bucket.selects[f.label][label] || 0) + 1;
          }
        }
      });
    });
  });
  return Object.values(wards).sort((a, b) =>
    String(a.ward).localeCompare(String(b.ward), undefined, { numeric: true }));
}

function renderWardReport(rows) {
  const wrap = document.getElementById('ward-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">No households synced yet — the ward report builds itself from the same live feed once submissions start arriving.</div>';
    return;
  }
  const wards = aggregateByWard(rows);
  wrap.innerHTML = wards.map(w => {
    const speciesRows = Object.values(w.species).map(sp => {
      const countsStr = Object.entries(sp.counts).map(([label, v]) => `${label.replace(/^Number of /,'')}: ${v}`).join(', ');
      const selectsStr = Object.entries(sp.selects).map(([, choiceMap]) =>
        Object.entries(choiceMap).map(([label, n]) => `<span class="breed-pill">${escapeHtml(label)} ×${n}</span>`).join('')
      ).join(' ');
      return `<tr>
        <td>${escapeHtml(sp.label)}</td>
        <td>${sp.total || '—'}</td>
        <td class="breakdown">${escapeHtml(countsStr) || '—'}</td>
        <td>${selectsStr || '<span class="breakdown">—</span>'}</td>
      </tr>`;
    }).join('');
    return `<div class="ward-card">
      <div class="ward-head">
        <span class="title">Ward ${escapeHtml(w.ward)}</span>
        <span class="sub">${w.households.size} household${w.households.size === 1 ? '' : 's'} reached
          &nbsp;·&nbsp; ${w.field} field visit${w.field === 1 ? '' : 's'}, ${w.self} self-report${w.self === 1 ? '' : 's'}${w.pending ? ` (<span style="color:#a05a1f">${w.pending} pending review</span>)` : ''}</span>
      </div>
      <table class="species-table">
        <thead><tr><th style="width:18%">Species</th><th style="width:10%">Total head</th><th style="width:37%">Breakdown</th><th style="width:35%">Breed / type mix</th></tr></thead>
        <tbody>${speciesRows || '<tr><td colspan="4" class="breakdown">No livestock recorded for this ward yet.</td></tr>'}</tbody>
      </table>
    </div>`;
  }).join('');
}

function fmtLag(ms) {
  if (ms < 1000) return ms + ' ms';
  if (ms < 60000) return (ms/1000).toFixed(1) + ' s';
  if (ms < 3600000) return Math.round(ms/60000) + ' min';
  return Math.round(ms/3600000) + ' hr';
}
function fmtLagCell(ms) {
  if (typeof ms !== 'number' || ms < 0) return '<span class="lag">–</span>';
  const cls = ms < 5000 ? 'lag instant' : 'lag';
  return `<span class="${cls}">${fmtLag(ms)}${ms < 5000 ? ' (immediate)' : ' (queued offline, synced later)'}</span>`;
}
function fmtSourceCell(source) {
  const s = source || 'field';
  const cls = s === 'field' ? 'source-field' : 'source-self';
  const label = s === 'field' ? 'Field visit' : s === 'sms' ? 'SMS self-report' : s === 'ussd' ? 'USSD self-report' : escapeHtml(s);
  return `<span class="pill ${cls}">${label}</span>`;
}
function fmtVerifiedCell(verified, localId) {
  if (verified !== false) return '<span class="pill verified-yes">Verified</span>';
  return `<span class="pill verified-no">Pending review</span><br>
    <button class="verify-btn" data-id="${escapeHtml(localId)}">Mark verified</button>`;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const tabFeedBtn = document.getElementById('tab-feed-btn');
const tabWardBtn = document.getElementById('tab-ward-btn');
const viewFeed = document.getElementById('view-feed');
const viewWard = document.getElementById('view-ward');
tabFeedBtn.addEventListener('click', () => {
  tabFeedBtn.classList.add('active'); tabWardBtn.classList.remove('active');
  viewFeed.style.display = ''; viewWard.style.display = 'none';
});
tabWardBtn.addEventListener('click', () => {
  tabWardBtn.classList.add('active'); tabFeedBtn.classList.remove('active');
  viewFeed.style.display = 'none'; viewWard.style.display = '';
  renderWardReport(latestRows);
});

load();
setInterval(load, 4000);
</script>
</body>
</html>
