<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chegutu Livestock Census</title>
<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livestock">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="top">
  <div>
    <div class="brand">Value10<span>x</span> · Chegutu Livestock Census</div>
    <div class="sub">FFS data collection — works fully offline</div>
  </div>
</header>

<div id="install-banner" class="install-banner" style="display:none;">
  <span>Add this to your home screen so it opens like an app, even with no signal.</span>
  <button id="install-btn">Install</button>
</div>

<div id="status-bar">
  <span class="dot offline" id="status-dot"></span>
  <span id="status-text">Checking connection…</span>
  <span id="queue-badge" class="zero">0 queued</span>
  <button class="code-btn" id="access-code-btn" title="Field access code">Code</button>
  <button class="sync-btn" id="sync-now"><span class="spinner"></span><span id="sync-btn-label">Sync now</span></button>
</div>

<main>
  <form id="census-form">
    <div class="section-title">Household</div>
    <div class="card" id="front-matter"></div>

    <div class="section-title">Livestock kept by this household</div>
    <div id="groups"></div>

    <div class="section-title">Notes</div>
    <div class="card">
      <div class="field">
        <label for="field_notes">Additional notes / observations</label>
        <input type="text" id="field_notes" name="field_notes">
      </div>
    </div>

    <div class="section-title">Queued on this device</div>
    <div class="card">
      <ul class="queue-list" id="queue-list"><li class="empty-row">No submissions yet on this device.</li></ul>
    </div>
  </form>
</main>

<footer class="action-bar">
  <button type="button" class="secondary" id="clear-btn">Clear form</button>
  <button type="submit" form="census-form" class="primary" id="submit-btn">Save household</button>
</footer>

<div class="toast" id="toast"></div>

<script src="/schema.js"></script>
<script src="/app.js"></script>
</body>
</html>
